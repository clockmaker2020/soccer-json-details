name: Update JSON Details

on:
  schedule:
    - cron: "0 * * * *"  # ✅ 매시간 정각(UTC 기준) 실행 (한국 시간 +9시간 적용)
  push:
    branches:
      - test
  workflow_dispatch:  # ✅ 수동 실행 가능하도록 추가

permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Check Date (Stop After Specific Date)  # ✅ 특정 날짜 이후 실행 중지
        run: |
          END_DATE="2025-03-31"  # ✅ 실행 종료 날짜 (YYYY-MM-DD)
          CURRENT_DATE=$(date -u +"%Y-%m-%d")

          if [[ "$CURRENT_DATE" > "$END_DATE" ]]; then
            echo "✅ 업데이트 기간이 종료되었습니다. 워크플로우를 중단합니다."
            exit 0
          fi

      - name: Reset Git Changes  # ✅ Git 충돌 방지
        run: |
          git reset --hard HEAD
          git clean -fd

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run JSON Update Script
        run: python generate_json_details.py  # ✅ JSON 자동 생성 스크립트 실행

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add data/
          git commit -m "Auto-update JSON details" || echo "No changes to commit"
          git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:test  # ✅ 강제 푸시
