name: Update JSON Details

on:
  schedule:
    - cron: "0 0 * * *"  # ✅ 매일 자정(UTC 기준) 실행 (한국 시간 오전 9시)
  push:
    branches:
      - test
  workflow_dispatch:  # ✅ 수동 실행 가능하도록 추가

permissions:  # ✅ GitHub Actions에 푸시 권한 부여
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run JSON Update Script
        run: python generate_json_details.py  # ✅ JSON 자동 생성 스크립트 실행

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add data/
          git commit -m "Auto-update JSON details" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:test
